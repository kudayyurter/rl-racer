# Neuroevolution: a population of small networks, the best survive and mutate.
track = "twisty"        # tracks/<name>.json, or a path
population = 128        # cars (networks) per generation
elite = 16              # survivors copied unchanged into the next generation
mutation_std = 0.1      # std of the Gaussian noise added to every weight of a child
hidden = [32]           # hidden layer sizes
# Equal budget for every method on twisty (spec). Counts car-decisions.
# Measured 2026-11-23 on twisty (Ryzen 7 7700X), env_steps / wall_time_s over ~60 s:
#   evolution 6.9k/s, reinforce 12.6k/s, a2c 8.6k/s, ppo 5.3k/s, sb3 5.0k/s (slowest; one batched sim since 2026-11-23).
# 4.5M steps = ~900 s for sb3 (the slowest), i.e. about 15 min. See configs/budgets.md.
env_steps_budget = 4_500_000
eval_every = 5          # generations between deterministic evaluations + checkpoints
seed = 0
