[project]
name = "rl-racer"
version = "0.1.0"
description = "Top-down 2D racing game where cars learn to drive with from-scratch RL"
requires-python = "==3.12.*"
dependencies = [
    "raylib>=5.5",
    "numpy>=2.0",
    "torch",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
racer = "racer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["racer"]

# CPU-only torch wheels: much smaller, and training here never uses a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
markers = ["slow: real training, minutes long"]
addopts = "-m 'not slow'"
